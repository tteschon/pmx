[project]
name = "pmx"
version = "0.1.0"
description = "Process discovery from event logs, built on pm4py."
readme = "README.md"
# AGPL because pmx links pm4py, which is AGPL v3. See the Licensing section
# of README.md before distributing this or putting it behind a network service.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "tteschon", email = "tyler.teschon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pm4py>=2.7.23.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
pmx = "pmx.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.environment]
root = ["./src"]
