name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a new pm4py release is caught even when nobody pushes. Only
  # pm4py-latest runs on it; the pinned jobs would repeat last week's result.
  # GitHub disables schedules on a public repo after 60 days without
  # activity, so a quiet stretch can mean this stopped running, not that
  # pm4py is fine -- check the Actions tab.
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: ty
        run: uv run ty check

  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The floor declared in pyproject.toml, plus every version up to the
        # one pinned in .python-version.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One macOS run, because that is where pmx is developed and where
          # Graphviz is installed differently.
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7

      # Three tests render real images through pm4py, which shells out to
      # Graphviz. Without `dot` they fail rather than skip.
      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --python ${{ matrix.python }}

      # Coverage is measured on one leg only -- instrumenting all five costs
      # time and tells you the same thing. Reported, not gated: there is no
      # --cov-fail-under, so a dip is visible without blocking a merge.
      - name: pytest
        run: |
          if [ "${{ matrix.os }}-${{ matrix.python }}" = "ubuntu-latest-3.14" ]; then
            uv run pytest -q --cov --cov-report=term-missing
          else
            uv run pytest -q
          fi
        shell: bash

      # The CLI has to survive being invoked for real, not just imported:
      # Typer wires its options at import time, so a bad Annotated default
      # only blows up when a command actually runs.
      #
      # Built from a literal here-doc rather than examples/data/, which is
      # gitignored and absent on a fresh clone.
      - name: Smoke-test the CLI
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/smoke.csv"
          cat > "$log" <<'CSV'
          case:concept:name,concept:name,time:timestamp
          c1,register,2026-01-01T09:00:00+00:00
          c1,check,2026-01-01T10:00:00+00:00
          c1,archive,2026-01-01T11:00:00+00:00
          c2,register,2026-01-02T09:00:00+00:00
          c2,check,2026-01-02T10:00:00+00:00
          c2,archive,2026-01-02T11:00:00+00:00
          c3,register,2026-01-03T09:00:00+00:00
          c3,archive,2026-01-03T10:00:00+00:00
          CSV
          uv run pmx --version
          uv run pmx inspect "$log" --json > "${RUNNER_TEMP}/summary.json"
          # stdout must be pure JSON. CliRunner tests can't see output that
          # bypasses sys.stdout, such as an import-time banner from pm4py.
          uv run python -m json.tool "${RUNNER_TEMP}/summary.json" > /dev/null
          uv run pmx discover "$log" --top-variants 1 \
            -o "${RUNNER_TEMP}/model.pnml" -i "${RUNNER_TEMP}/model.png"
          test -s "${RUNNER_TEMP}/model.png"  # proves Graphviz really works

  # The `test` job runs the pm4py pinned in uv.lock, but `uv tool install`
  # ignores the lock and resolves the newest pm4py -- which is what users
  # actually run. This job tests that version. pm4py ships behaviour changes
  # in four-part releases (2.7.23.x), so a version ceiling would not help.
  #
  # Keep this out of the required checks: it can go red because of an
  # upstream release, not because of the PR it happens to run on.
  pm4py-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Not --locked: upgrade pm4py past the lock, leaving everything else
      # pinned so a failure points at pm4py.
      - run: uv sync --upgrade-package pm4py
      - name: pm4py version
        run: uv run python -c "import pm4py; print(pm4py.__version__)" 2>/dev/null
      - run: uv run pytest -q

      # Only the weekly run files an issue; a PR's failure already shows on
      # the PR. One open issue at a time -- later failures comment on it.
      - name: Report a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(uv run python -c "import pm4py; print(pm4py.__version__)" 2>/dev/null || echo unknown)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Tests fail against the newest pm4py"
          body="The weekly run against pm4py ${version} failed: ${run_url}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
